AWSTemplateFormatVersion: '2010-09-09'
Description: Invite-only RecruitSage MCP broker. Deploy a reviewed image to App Runner.
Parameters:
  ImageIdentifier:
    Type: String
    Description: Full ECR image URI and immutable digest (repository@sha256:...).
  PublicOrigin:
    Type: String
    Description: HTTPS App Runner origin. Update after first service creation.
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito managed-login domain prefix.
  McpCallbackUrl:
    Type: String
    Description: Exact OAuth callback URL supported by the chosen MCP client.
Resources:
  BrokerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: recruitsage-mcp
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
  McpClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
      CallbackURLs:
        - !Ref McpCallbackUrl
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
  CompanionClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
      CallbackURLs:
        - http://127.0.0.1:48731/callback
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
  AccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullImage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/recruitsage-mcp
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BrokerTableOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !GetAtt BrokerTable.Arn
  AppService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: recruitsage-mcp
      AutoScalingConfigurationArn: !GetAtt Scaling.AutoScalingConfigurationArn
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AccessRole.Arn
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: '3000'
            RuntimeEnvironmentVariables:
              BROKER_TABLE: !Ref BrokerTable
              COGNITO_USER_POOL_ID: !Ref UserPool
              COGNITO_MCP_CLIENT_ID: !Ref McpClient
              COGNITO_COMPANION_CLIENT_ID: !Ref CompanionClient
              COGNITO_ISSUER: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              PUBLIC_ORIGIN: !Ref PublicOrigin
      InstanceConfiguration:
        Cpu: '0.25 vCPU'
        Memory: '0.5 GB'
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
      NetworkConfiguration:
        IngressConfiguration:
          IsPubliclyAccessible: true
  Scaling:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: recruitsage-mcp-capped
      MaxConcurrency: 10
      MaxSize: 2
      MinSize: 1
Outputs:
  ServiceUrl:
    Value: !GetAtt AppService.ServiceUrl
  UserPoolId:
    Value: !Ref UserPool
  McpClientId:
    Value: !Ref McpClient
  CompanionClientId:
    Value: !Ref CompanionClient
  CognitoDomain:
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
